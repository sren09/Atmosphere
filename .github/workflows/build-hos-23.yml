name: Build HOS 23.0.0 preview

on:
  workflow_dispatch:
  push:
    branches:
      - hos-23.0.0

permissions:
  contents: read

concurrency:
  group: hos-23-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build toolchain image
        run: docker build --tag atmosphere-builder:hos-23 .

      - name: Build release artifacts
        run: |
          docker run --rm \
            --user 0:0 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            atmosphere-builder:hos-23 \
            bash -euxo pipefail -c '
              git config --global --add safe.directory /workspace

              git clone https://github.com/switchbrew/libnx.git /tmp/libnx
              git -C /tmp/libnx checkout 146c3d1446d35546943c7b6cfcd479bc1f5e9b67
              make -C /tmp/libnx -j2
              make -C /tmp/libnx/nx install

              make -C troposphere/haze -j1
              make -j2 dist-no-debug-nx_release
            '

      - name: Generate checksums
        run: sha256sum out/atmosphere-*.zip out/fusee.bin > out/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atmosphere-hos-23-${{ github.sha }}
          path: |
            out/atmosphere-*.zip
            out/fusee.bin
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
